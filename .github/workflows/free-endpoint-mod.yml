name: Build experimental SRBX server mod

on:
    push:
        branches: [feature/kaizpatch-free-endpoint-mod]
        paths:
            [
                "mod/**",
                "src/**",
                "tests/**",
                "rtmx.json",
                "package.json",
                "pnpm-lock.yaml",
                ".github/workflows/free-endpoint-mod.yml",
            ]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.17.0
                  cache: pnpm
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "25"
                  cache: gradle
                  cache-dependency-path: |
                      pnpm-lock.yaml
                      rtmx.json
            - name: Build and test coremod (Java 8 bytecode)
              run: python3 mod/build.py --core-only --test
            - uses: actions/cache/restore@v4
              id: generated
              with:
                  path: generated
                  key: srbx-types-${{ hashFiles('rtmx.json', 'pnpm-lock.yaml') }}
            - name: Install and generate model pack types
              id: generate
              run: |
                  pnpm install --frozen-lockfile
                  if [ "${{ steps.generated.outputs.cache-hit }}" != "true" ]; then
                    npm_config_gradle_java_home="$JAVA_HOME" pnpm exec rtmx generate
                  fi
            - uses: actions/cache/save@v4
              if: steps.generated.outputs.cache-hit != 'true'
              with:
                  path: generated
                  key: ${{ steps.generated.outputs.cache-primary-key }}
            - name: Build embedded SRBX model pack
              run: pnpm exec rtmx build
            - name: Regression tests
              run: |
                  pnpm test:rail-patch
                  pnpm test:runtime-dispatch
                  pnpm test:appleextended
                  pnpm test:input
                  pnpm test:kaizpatch
                  pnpm test:rail-boundary
                  pnpm test:train-debug
            - name: Package client model pack
              run: pnpm exec rtmx zip
            - name: Package SRBX with server patch
              run: python3 mod/build.py
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: SRBXMod-experimental-${{ github.sha }}
                  path: |
                      artifacts/SRBXMod-0.1.0-experimental.jar
                      artifacts/*.zip
